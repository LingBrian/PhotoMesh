openapi: 3.1.0
info:
  title: PhotoMesh Node API (Design Draft)
  version: 0.1.0
  description: |
    草案：用于最初合约讨论，不可直接作为已实现服务。
    P2P 内部事件通道、端到端加密流程与会话身份另有协议安全设计。
servers:
  - url: https://localhost:8443
security:
  - deviceBearer: []
paths:
  /v1/health:
    get:
      summary: 核心服务健康检查（不返回敏感元数据）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, protocolMin, protocolMax]
                properties:
                  status: {type: string, enum: [ok, degraded]}
                  protocolMin: {type: integer}
                  protocolMax: {type: integer}
  /v1/libraries:
    get:
      summary: 当前主体有权查看的照片库
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Library'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /v1/assets:
    get:
      summary: 授权范围内的游标分页时间线
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Assets page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetPage'}
        '403': {description: Library access denied}
  /v1/pairing/invitations:
    post:
      summary: 创建短期一次性 LAN 配对邀请（返回供客户端编码为二维码的载荷）
      responses:
        '201':
          description: 2 分钟有效、一次性使用的邀请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingInvite'}
        '403': {description: Pairing administration denied}
  /v1/pairing/join:
    post:
      summary: 扫描邀请二维码后，以本地节点身份通过 Noise 通道加入对端
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingJoin'}
      responses:
        '200':
          description: Remote Peer ID verified and trusted locally
          content:
            application/json:
              schema:
                type: object
                required: [hostPeerId]
                properties:
                  hostPeerId: {type: string}
        '400': {description: Invalid request}
        '403': {description: 'Invite expired, replayed, declined, or identity mismatch'}
  /v1/pairing/peers:
    get:
      summary: 列出可信、已撤销节点和待审批设备
      responses:
        '200':
          description: Trust and approval state
          content:
            application/json:
              schema:
                type: object
                required: [peers, pending]
                properties:
                  peers: {type: array, items: {$ref: '#/components/schemas/TrustedPeer'}}
                  pending: {type: array, items: {$ref: '#/components/schemas/PendingPeerApproval'}}
        '403': {description: Pairing administration denied}
  /v1/pairing/peers/{peerId}/approval:
    post:
      summary: 本地用户确认或拒绝经过 Noise 身份验证的配对请求
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingApproval'}
      responses:
        '200': {description: Approval recorded}
        '403': {description: Pairing administration denied}
        '404': {description: Pending request not found}
  /v1/pairing/peers/{peerId}:
    delete:
      summary: 撤销节点并关闭现存 P2P 连接
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Peer revoked}
        '403': {description: Pairing administration denied}
        '404': {description: Peer not found}
  /v1/pairing/peers/{peerId}/libraries/{libraryId}:
    put:
      summary: 明确授予可信节点对单个图库的只读权限
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
        - in: path
          name: libraryId
          required: true
          schema: {type: string}
      responses:
        '204': {description: Read grant recorded}
        '403': {description: Pairing administration denied}
        '409': {description: Peer is not trusted}
  /v1/pairing/discovered:
    get:
      summary: 获取 mDNS 发现的未信任节点地址（发现不代表信任）
      responses:
        '200':
          description: Discovered peer hints
          content:
            application/json:
              schema:
                type: object
                required: [peers]
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      required: [peerId, addresses]
                      properties:
                        peerId: {type: string}
                        addresses: {type: array, items: {type: string}}
        '403': {description: Pairing administration denied}
  /v1/pairing/manual-discovery:
    post:
      summary: 通过明确私有 LAN IP 建立 Noise 身份验证连接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, peerId]
              properties:
                host: {type: string}
                port: {type: integer, minimum: 1, maximum: 65535}
                peerId: {type: string}
      responses:
        '200': {description: Authenticated peer address}
        '400': {description: Invalid address}
        '403': {description: Pairing administration denied}
  /v1/uploads:
    post:
      summary: 创建有期限的分块上传会话
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCreate'}
      responses:
        '201':
          description: Upload session created or replayed idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '400': {description: Invalid request}
        '403': {description: Denied}
        '409': {description: Idempotency key reused for a different request}
        '413': {description: Upload exceeds configured limits}
  /v1/uploads/{sessionId}:
    get:
      summary: 查询允许续传的偏移位置
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '403': {description: Denied}
        '404': {description: Session not found}
        '410': {description: Session expired}
  /v1/uploads/{sessionId}/chunks/{chunkIndex}:
    put:
      summary: Write one immutable, resumable upload chunk
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
        - in: path
          name: chunkIndex
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Offset
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Chunk-SHA256
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Chunk accepted and offset durably advanced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
        '403': {description: Denied}
        '409': {description: Offset or chunk idempotency conflict}
        '413': {description: Chunk exceeds configured limits}
        '422': {description: Chunk checksum mismatch}
        '507': {description: Managed storage has insufficient capacity}
  /v1/uploads/{sessionId}/complete:
    post:
      summary: Verify complete SHA-256 and atomically commit immutable original
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Original published and metadata committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadComplete'}
        '403': {description: Denied}
        '409': {description: Upload incomplete or session not writable}
        '410': {description: Session expired}
        '422': {description: Complete file checksum mismatch}
        '507': {description: Managed storage has insufficient capacity}
  /v1/sync/hello:
    post:
      summary: 受信任节点 P2P 版本协商（仅内部受认证通道）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId, protocolMin, protocolMax, nonce]
              properties:
                nodeId: {type: string}
                protocolMin: {type: integer}
                protocolMax: {type: integer}
                nonce: {type: string}
      responses:
        '200':
          description: Negotiated
          content:
            application/json:
              schema:
                type: object
                required: [agreedProtocol]
                properties:
                  agreedProtocol: {type: integer}
        '403': {description: Node not paired or invalid signature}
components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      bearerFormat: device-bound-token
  schemas:
    PairingInvite:
      type: object
      required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt, qrDataUrl]
      properties:
        protocol: {type: string, const: photomesh-pairing}
        version: {type: integer, const: 1}
        hostPeerId: {type: string}
        addresses: {type: array, items: {type: string}}
        inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
        secret: {type: string, minLength: 43, maxLength: 43}
        expiresAt: {type: string, format: date-time}
        qrDataUrl: {type: string, pattern: '^data:image/png;base64,'}
    PairingJoin:
      type: object
      required: [invite, label]
      properties:
        invite:
          type: object
          required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt]
          properties:
            protocol: {type: string, const: photomesh-pairing}
            version: {type: integer, const: 1}
            hostPeerId: {type: string}
            addresses: {type: array, maxItems: 32, items: {type: string, maxLength: 512}}
            inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
            secret: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
            expiresAt: {type: string, format: date-time}
        label: {type: string, maxLength: 80}
        manualIp:
          type: object
          required: [host, port]
          properties:
            host: {type: string}
            port: {type: integer, minimum: 1, maximum: 65535}
    TrustedPeer:
      type: object
      required: [peerId, publicKey, label, trustState, createdAt, revokedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        label: {type: string}
        trustState: {type: string, enum: [trusted, revoked]}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    PendingPeerApproval:
      type: object
      required: [peerId, publicKey, proposedLabel, requestedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        proposedLabel: {type: string}
        requestedAt: {type: string, format: date-time}
    PairingApproval:
      type: object
      required: [approved]
      properties:
        approved: {type: boolean}
        label: {type: string, maxLength: 80}
        libraryIds: {type: array, uniqueItems: true, items: {type: string, maxLength: 128}}
    Library:
      type: object
      required: [libraryId, title, encryptionPolicy]
      properties:
        libraryId: {type: string}
        title: {type: string}
        encryptionPolicy: {type: string, enum: [none, optional_e2ee, required_e2ee]}
    Asset:
      type: object
      required: [assetId, libraryId, originNodeId, kind, sha256, availability]
      properties:
        assetId: {type: string}
        libraryId: {type: string}
        originNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        capturedAt: {type: string, format: date-time}
        availability: {type: string, enum: [online, cached, offline, missing]}
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Asset'}
        nextCursor: {type: [string, 'null']}
    UploadCreate:
      type: object
      required: [libraryId, filename, sourceKind, totalBytes, sha256]
      properties:
        libraryId: {type: string}
        filename: {type: string, minLength: 1}
        originalPath: {type: string, description: Exact source path metadata; never used as a write destination}
        sourceKind: {type: string, enum: [upload, import]}
        sourceNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo], default: photo}
        totalBytes: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    UploadSession:
      type: object
      required: [sessionId, offset, expiresAt, state]
      properties:
        sessionId: {type: string}
        offset: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [created, uploading, verifying, completed, failed]}
    UploadComplete:
      type: object
      required: [sessionId, assetId, fileId, sha256, byteLength, storageRef]
      properties:
        sessionId: {type: string}
        assetId: {type: string}
        fileId: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteLength: {type: integer, minimum: 0}
        storageRef: {type: string}
