      summary: Revoke a peer's future favorite writes without retracting accepted events
      responses:
        '200': {description: Grant revoked or already absent, content: {application/json: {schema: {$ref: '#/components/schemas/FavoriteSyncGrantStatus'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Local node-admin authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer or library not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Favorite sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/libraries/{libraryId}/favorite-sync-grants:
    get:
      operationId: listFavoriteSyncGrants
      summary: List active favorite-write grants for a library
      parameters:
        - in: path
          name: libraryId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Active grant records only, content: {application/json: {schema: {$ref: '#/components/schemas/FavoriteSyncGrantList'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Library not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Favorite sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/peers/{peerId}/favorite-sync-status:
    get:
      operationId: getFavoriteSyncStatus
      summary: Get per-peer favorite sync queue count and enumerated last-error code
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Operational counters and fixed error code only, content: {application/json: {schema: {$ref: '#/components/schemas/FavoriteSyncPeerStatus'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Favorite sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/peers/{peerId}/libraries/{libraryId}/rating-write:
    parameters:
      - in: path
        name: peerId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    put:
      operationId: grantRatingWrite
      summary: Grant a trusted peer default-deny rating-write authority for one library
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RatingSyncGrantRequest'}}}
      responses:
        '200': {description: Grant recorded, content: {application/json: {schema: {$ref: '#/components/schemas/RatingSyncGrantStatus'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '400': {description: Invalid grant request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Local node-admin authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer or library not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: 'Peer is not trusted, lacks a library-read grant, or the 64-author limit is reached; revoked author slots remain reserved', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Rating sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    delete:
      operationId: revokeRatingWrite
      summary: Revoke a peer's future rating writes without retracting accepted events
      responses:
        '200': {description: Grant revoked or already absent, content: {application/json: {schema: {$ref: '#/components/schemas/RatingSyncGrantStatus'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Local node-admin authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer or library not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Rating sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/libraries/{libraryId}/rating-sync-grants:
    get:
      operationId: listRatingSyncGrants
      summary: List active rating-write grants for one library
      parameters:
        - in: path
          name: libraryId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Active grant records only, content: {application/json: {schema: {$ref: '#/components/schemas/RatingSyncGrantList'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Library not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Rating sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/peers/{peerId}/rating-sync-status:
    get:
      operationId: getRatingSyncStatus
      summary: Get rating sync queue count and enumerated error status for a peer
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200': {description: Operational counters and fixed error code only, content: {application/json: {schema: {$ref: '#/components/schemas/RatingSyncPeerStatus'}}}, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Rating sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/discovered:
    get:
      summary: 获取 mDNS 发现的未信任节点地址（发现不代表信任）
      responses:
        '200':
          description: Discovered peer hints
          content:
            application/json:
              schema:
                type: object
                required: [peers]
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      required: [peerId, addresses]
                      properties:
                        peerId: {type: string}
                        addresses: {type: array, items: {type: string}}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/manual-discovery:
    post:
      summary: 通过明确私有 LAN IP 建立 Noise 身份验证连接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, peerId]
              properties:
                host: {type: string}
                port: {type: integer, minimum: 1, maximum: 65535}
                peerId: {type: string}
      responses:
        '200': {description: Authenticated peer address, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '400': {description: Invalid address, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '502': {description: Peer could not be reached, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads:
    post:
      summary: 创建有期限的分块上传会话
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCreate'}
      responses:
        '201':
          description: Upload session created or replayed idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Idempotency key reused for a different request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Upload exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload session creation failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}:
    get:
      summary: 查询允许续传的偏移位置
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload session lookup failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}/chunks/{chunkIndex}:
    put:
      summary: Write one immutable, resumable upload chunk
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
        - in: path
          name: chunkIndex
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Offset
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Chunk-SHA256
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Chunk accepted and offset durably advanced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '400': {description: Invalid offset or request body, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Upload session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Upload session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Offset or chunk idempotency conflict, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Chunk exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '422': {description: Chunk checksum mismatch, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Chunk write failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '507': {description: Managed storage has insufficient capacity, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}/complete:
    post:
      summary: Verify complete SHA-256 and atomically commit immutable original
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Original published and metadata committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadComplete'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Upload session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Upload incomplete or session not writable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Upload exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '422': {description: Complete file checksum mismatch, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload completion failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '507': {description: Managed storage has insufficient capacity, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    nodeAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: node-admin-token
  parameters:
    AlbumIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID operation ID globally unique across libraries, resources and mutation types; retained durably for replay.
      schema: {type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
    RatingIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID operation ID for idempotent shared rating mutation.
      schema: {type: string, format: uuid, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
  schemas:
    Album:
      type: object
      additionalProperties: false
      required: [albumId, libraryId, title, createdByPeerId, createdAt]
      properties:
        albumId: {type: string, format: uuid}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        title:
          type: string
          minLength: 1
          description: Leading/trailing ECMAScript WhiteSpace/LineTerminator code points are trimmed; UTF-8 byte length is 1..256. No NFC/NFD or case normalization.
          x-maxUtf8Bytes: 256
        createdByPeerId: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
    CreateAlbumRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          description: Leading/trailing ECMAScript WhiteSpace/LineTerminator code points are trimmed; UTF-8 byte length is 1..256. No NFC/NFD or case normalization.
          x-maxUtf8Bytes: 256
    AlbumPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Album'}}
        nextCursor: {type: [string, 'null'], maxLength: 2048}
    AlbumMember:
      type: object
      additionalProperties: false
      required: [assetId]
      properties:
        assetId: {type: string, minLength: 1, maxLength: 128}
    AlbumMemberPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AlbumMember'}}
        nextCursor: {type: [string, 'null'], maxLength: 2048}
    AlbumDeletionRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: {type: string, enum: [local, global]}
    AlbumDeletionResult:
      type: object
      additionalProperties: false
      required: [albumId, libraryId, scope, status, deletedAt]
      properties:
        albumId: {type: string, format: uuid}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        scope: {type: string, enum: [local, global]}
        status: {type: string, enum: [deleted, already_deleted]}
        deletedAt: {type: string, format: date-time}
    AlbumRestoreRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: {type: string, enum: [local, global]}
    AlbumRestoreResult:
      type: object
      additionalProperties: false
      required: [albumId, libraryId, scope, status]
      properties:
        albumId: {type: string, format: uuid}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        scope: {type: string, enum: [local, global]}
        status: {type: string, enum: [restored, already_active]}
    DeletedAlbum:
      type: object
      additionalProperties: false
      required: [albumId, libraryId, title, createdByPeerId, createdAt, scopes, deletedAt]
      properties:
        albumId: {type: string, format: uuid}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        title: {type: string}
        createdByPeerId: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
        scopes: {type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: {type: string, enum: [local, global]}}
        deletedAt: {type: string, format: date-time}
    DeletedAlbumPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/DeletedAlbum'}}
        nextCursor: {type: [string, 'null'], maxLength: 2048}
    AlbumSyncGrantRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean, const: true, description: Grant enabled; revoke using DELETE.}
    AlbumSyncGrantStatus:
      type: object
      additionalProperties: false
      required: [peerId, libraryId, permission, granted]
      properties:
        peerId: {type: string, minLength: 1, maxLength: 128}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        permission: {type: string, enum: [album-write, album-delete]}
        granted: {type: boolean}
    AlbumSyncGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants: {type: array, items: {$ref: '#/components/schemas/AlbumSyncGrantStatus'}}
    AlbumSyncPeerStatus:
      type: object
      additionalProperties: false
      required: [peerId, pendingEvents, lastErrorCode]
      properties:
        peerId: {type: string, minLength: 1, maxLength: 128}
        pendingEvents: {type: integer, minimum: 0}
        lastErrorCode: {type: [string, 'null'], enum: [unauthorized, unavailable, conflict, null]}
    AssetFavoriteSetRequest:
       type: object
       additionalProperties: false
       required: [favorite]
       properties:
         favorite: {type: boolean, description: Set the shared state for the entire library, not a personal bookmark}
    AssetFavoriteState:
       type: object
       additionalProperties: false
       required: [favorite]
       properties:
         favorite: {type: boolean}
    FavoriteSyncGrantRequest:
       type: object
       additionalProperties: false
       required: [enabled]
       properties:
         enabled: {type: boolean, const: true}
    FavoriteSyncGrantStatus:
       type: object
       additionalProperties: false
       required: [peerId, libraryId, permission, granted]
       properties:
         peerId: {type: string, minLength: 1, maxLength: 128}
         libraryId: {type: string, minLength: 1, maxLength: 128}
         permission: {type: string, const: favorite-write}
         granted: {type: boolean}
    FavoriteSyncGrantList:
       type: object
       additionalProperties: false
       required: [grants]
       properties:
         grants: {type: array, items: {$ref: '#/components/schemas/FavoriteSyncGrantStatus'}}
    FavoriteSyncPeerStatus:
       type: object
       additionalProperties: false
       required: [peerId, pendingEvents, lastErrorCode]
       properties:
         peerId: {type: string, minLength: 1, maxLength: 128}
         pendingEvents: {type: integer, minimum: 0}
         lastErrorCode: {type: [string, 'null'], enum: [unauthorized, unavailable, conflict, null]}
    NullableRatingValue:
      anyOf:
        - type: integer
          minimum: 1
          maximum: 5
        - type: 'null'
    AssetRatingSetRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: {$ref: '#/components/schemas/NullableRatingValue', description: Integer from 1 to 5, or explicit null to clear.}
    AssetRatingState:
      type: object
      additionalProperties: false
      required: [rating, ratingConflict, ratingCandidates]
      properties:
        rating: {$ref: '#/components/schemas/NullableRatingValue'}
        ratingConflict: {type: boolean}
        ratingCandidates:
          type: array
          maxItems: 64
          uniqueItems: true
          items: {$ref: '#/components/schemas/NullableRatingValue'}
    RatingSyncGrantRequest:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean, const: true, description: Grant enabled; revoke using DELETE.}
    RatingSyncGrantStatus:
      type: object
      additionalProperties: false
      required: [peerId, libraryId, permission, granted]
      properties:
        peerId: {type: string, minLength: 1, maxLength: 128}
        libraryId: {type: string, minLength: 1, maxLength: 128}
        permission: {type: string, const: rating-write}
        granted: {type: boolean}
    RatingSyncGrantList:
      type: object
      additionalProperties: false
      required: [grants]
      properties:
        grants: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/RatingSyncGrantStatus'}}
    RatingSyncPeerStatus:
      type: object
      additionalProperties: false
      required: [peerId, pendingEvents, lastErrorCode]
      properties:
        peerId: {type: string, minLength: 1, maxLength: 128}
        pendingEvents: {type: integer, minimum: 0}
        lastErrorCode: {type: [string, 'null'], enum: [unauthorized, unavailable, conflict, null]}
    NodeDiagnostics:
      type: object
      additionalProperties: false
      required: [status, readiness, components]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        readiness: {type: string, enum: [ready, not_ready]}
        components:
          type: object
          additionalProperties: false
          required: [api, database, storage, identity]
          properties:
            api: {$ref: '#/components/schemas/DiagnosticComponent'}
            database: {$ref: '#/components/schemas/DiagnosticComponent'}
            storage: {$ref: '#/components/schemas/DiagnosticComponent'}
            identity: {$ref: '#/components/schemas/DiagnosticComponent'}
    DiagnosticComponent:
      type: object
      additionalProperties: false
      required: [status, capabilities]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        capabilities:
          type: array
          uniqueItems: true
          maxItems: 17
          items:
            type: string
            enum: [rest, mediaVersions, thumbnails, assetTags, gallerySearch, galleryFilters, virtualAlbums, assetFavorites, favoriteSync, tagSync, assetRatings, ratingSync, sqlite, managedFiles, nodeIdentity, eventSigning, lanPairing]
    PairingInvite:
      type: object
      required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt, qrDataUrl]
      properties:
        protocol: {type: string, const: photomesh-pairing}
        version: {type: integer, const: 1}
        hostPeerId: {type: string}
        addresses: {type: array, items: {type: string}}
        inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
        secret: {type: string, minLength: 43, maxLength: 43}
        expiresAt: {type: string, format: date-time}
        qrDataUrl: {type: string, pattern: '^data:image/png;base64,'}
    PairingJoin:
      type: object
      required: [invite, label]
      properties:
        invite:
          type: object
          required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt]
          properties:
            protocol: {type: string, const: photomesh-pairing}
            version: {type: integer, const: 1}
            hostPeerId: {type: string}
            addresses: {type: array, maxItems: 32, items: {type: string, maxLength: 512}}
            inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
            secret: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
            expiresAt: {type: string, format: date-time}
        label: {type: string, maxLength: 80}
        manualIp:
          type: object
          required: [host, port]
          properties:
            host: {type: string}
            port: {type: integer, minimum: 1, maximum: 65535}
    TrustedPeer:
      type: object
      required: [peerId, publicKey, label, trustState, createdAt, revokedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        label: {type: string}
        trustState: {type: string, enum: [trusted, revoked]}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    PendingPeerApproval:
      type: object
      required: [peerId, publicKey, proposedLabel, requestedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        proposedLabel: {type: string}
        requestedAt: {type: string, format: date-time}
    PairingApproval:
      type: object
      required: [approved]
      properties:
        approved: {type: boolean}
        label: {type: string, maxLength: 80}
        libraryIds: {type: array, uniqueItems: true, items: {type: string, maxLength: 128}}
    Library:
      type: object
      required: [libraryId, title]
      properties:
        libraryId: {type: string}
        title: {type: string}
        encryptionPolicy: {type: string, enum: [none, optional_e2ee, required_e2ee]}
    LibraryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Library'}}
    ExternalScanReviewPage:
      type: object
      required: [roots]
      properties:
        roots: {type: array, items: {$ref: '#/components/schemas/ExternalScanReview'}}
    ExternalScanReview:
      type: object
      required: [rootId, libraryId, complete, indexed, missing, offline, directories, issues, locations]
      properties:
        rootId: {type: string}
        libraryId: {type: string}
        complete: {type: boolean}
        indexed: {type: integer, minimum: 0}
        missing: {type: integer, minimum: 0}
        offline: {type: integer, minimum: 0}
        directories: {type: array, items: {type: string}}
        issues: {type: array, items: {type: object, required: [code], properties: {code: {type: string}}}}
        locations: {type: array, items: {$ref: '#/components/schemas/ExternalScanReviewLocation'}}
    ExternalScanReviewLocation:
      type: object
      required: [locationId, originalPath, availability]
      properties:
        locationId: {type: string}
        originalPath: {type: [string, 'null']}
        availability: {type: string, enum: [offline, missing]}
    Asset:
      type: object
      required: [assetId, libraryId, originNodeId, kind, sha256, availability, filename, capturedAt, sourcePath, sourceKind, byteSize, version, tags, rating, ratingConflict, ratingCandidates]
      properties:
        assetId: {type: string}
        libraryId: {type: string}
        originNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        capturedAt: {type: [string, 'null'], format: date-time, description: Absolute capture instant normalized to UTC; null when the source has no verified timezone.}
        captureLocalTime: {type: [string, 'null'], pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}$', description: Source wall time without a timezone; do not interpret it as UTC.}
        captureOffsetMinutes: {type: [integer, 'null'], minimum: -840, maximum: 840, description: EXIF original-time offset from UTC in minutes, if verified.}
        captureSource: {type: string, enum: [exif_offset, exif_floating, legacy_unknown, unknown]}
        captureConfidence: {type: string, enum: [high, medium, unknown]}
        availability: {type: string, enum: [online, cached, offline, missing]}
        filename: {type: string}
        sourcePath: {type: [string, 'null']}
        sourceKind: {type: string, enum: [upload, import]}
        byteSize: {type: integer, minimum: 0}
        version: {type: string}
        tags:
          type: array
          maxItems: 4096
          description: Current merged signed OR-set membership on this Node; sorted and synchronized independently of metadata events. A writer may contribute at most 64 active tags per asset; the merged view is capped at 4096.
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: Trimmed, case-sensitive tag text with a maximum of 128 UTF-8 bytes.
        favorite:
          type: boolean
          description: Library-wide shared favorite state (not a personal bookmark); absent on pre-PM-046 Nodes without the assetFavorites diagnostic capability.
        rating: {$ref: '#/components/schemas/NullableRatingValue', description: Current shared library-wide rating; null when clear or conflicted.}
        ratingConflict: {type: boolean, description: True when multiple concurrent rating candidates remain unresolved.}
        ratingCandidates:
          type: array
          maxItems: 64
          uniqueItems: true
          description: Current causal MV-register candidates, without author or principal identity.
          items: {$ref: '#/components/schemas/NullableRatingValue'}
    DuplicateCandidateAsset:
      type: object
      additionalProperties: false
      required: [assetId, originNodeId, kind, sha256, byteSize, filename, sourcePath, sourceKind, availability]
      properties:
        assetId: {type: string}
        originNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteSize: {type: integer, minimum: 0}
        filename: {type: string}
        sourcePath: {type: [string, 'null']}
        sourceKind: {type: string, enum: [upload, import]}
        availability: {type: string, enum: [online, cached, offline, missing]}
    DuplicateCandidateGroup:
      type: object
      additionalProperties: false
      required: [sha256, byteSize, assets, truncated]
      properties:
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteSize: {type: integer, minimum: 0}
        assets: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/DuplicateCandidateAsset'}}
        truncated: {type: boolean}
    DuplicateCandidatePage:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/DuplicateCandidateGroup'}}
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Asset'}
        nextCursor: {type: [string, 'null']}
    MediaCrop:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: {type: integer, minimum: 0, maximum: 1000000}
        y: {type: integer, minimum: 0, maximum: 1000000}
        width: {type: integer, minimum: 1, maximum: 1000000}
        height: {type: integer, minimum: 1, maximum: 1000000}
    MediaTransform:
      type: object
      additionalProperties: false
      required: [crop, rotation]
      properties:
        crop: {$ref: '#/components/schemas/MediaCrop'}
        rotation: {type: integer, enum: [0, 90, 180, 270]}
    MediaVersionCreate:
      type: object
      additionalProperties: false
      required: [sourceVersionId, sourceSha256, transform, idempotencyKey]
      properties:
        sourceVersionId: {type: [string, 'null'], minLength: 1, maxLength: 128}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        transform: {$ref: '#/components/schemas/MediaTransform'}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$'}
    MediaVersionStatus:
      type: string
      enum: [staging, ready, failed]
    MediaVersionOperation:
      type: object
      additionalProperties: false
      required: [operationId, versionId, status]
      properties:
        operationId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MediaVersionStatus'}
    MediaVersion:
      type: object
      additionalProperties: false
      required: [versionId, assetId, sourceVersionId, sourceSha256, outputSha256, mimeType, byteSize, width, height, transform, status, createdAt, errorCode]
      properties:
        versionId: {type: string, format: uuid}
        assetId: {type: string}
        sourceVersionId: {type: [string, 'null']}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        outputSha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        mimeType: {type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, null]}
        byteSize: {type: [integer, 'null'], minimum: 0}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        transform: {$ref: '#/components/schemas/MediaTransform'}
        status: {$ref: '#/components/schemas/MediaVersionStatus'}
        createdAt: {type: string, format: date-time}
        errorCode: {type: [string, 'null']}
    MediaVersionSource:
      type: object
      additionalProperties: false
      required: [sourceVersionId, sha256, mimeType, byteSize, filename, availability]
      properties:
        sourceVersionId: {type: 'null'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        mimeType: {type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, null]}
        byteSize: {type: integer, minimum: 0}
        filename: {type: string}
        availability: {type: string, enum: [online, cached, offline, missing]}
    MediaVersionPage:
      type: object
      additionalProperties: false
      required: [original, items]
      properties:
        original: {$ref: '#/components/schemas/MediaVersionSource'}
        items: {type: array, items: {$ref: '#/components/schemas/MediaVersion'}}
    Tombstone:
      type: object
      required: [assetId, libraryId, eventId]
      properties:
        assetId: {type: string}
        libraryId: {type: string}
        eventId: {type: string}
    UploadCreate:
      type: object
      required: [libraryId, filename, sourceKind, totalBytes, sha256]
      properties:
        libraryId: {type: string}
        filename: {type: string, minLength: 1}
        originalPath: {type: string, description: Exact source path metadata; never used as a write destination}
        sourceKind: {type: string, enum: [upload, import]}
        sourceNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo], default: photo}
        totalBytes: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    UploadSession:
      type: object
      required: [sessionId, offset, expiresAt, state]
      properties:
        sessionId: {type: string}
        offset: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [created, uploading, verifying, completed, failed]}
    UploadComplete:
      type: object
      required: [sessionId, assetId, fileId, sha256, byteLength, storageRef]
      properties:
        sessionId: {type: string}
        assetId: {type: string}
        fileId: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteLength: {type: integer, minimum: 0}
        storageRef: {type: string}
    ApiError:
      type: object
      description: Open error envelope. Clients must tolerate unknown error codes and additional fields.
      required:
        - error
        - requestId
      properties:
        error:
          type: string
          minLength: 1
          description: Stable machine-readable error code; unknown values are possible. This example list is not closed.
          examples: [invalid_request, forbidden, not_found, capability_unavailable, writer_limit_reached, thumbnail_invalid, source_offline, source_missing, media_read_failed, unsupported_media_type, version_failed, version_not_ready, tombstone_not_active, causal_context_conflict, pairing_rejected, peer_unreachable, pending_request_not_found, peer_not_trusted, peer_not_found, idempotency_conflict, conflict, rating_conflict_limit, offset_conflict, chunk_conflict, session_failed, incomplete_upload, session_expired, too_large, checksum_mismatch, capacity_exhausted, storage_io, source_changed, unsupported_media, processing_failed, queue_full, storage_failed, version_unavailable]
        requestId:
          type: string
          minLength: 1
          description: Matches the X-Request-ID response header.
  headers:
    XRequestId:
      description: Correlation ID echoed from the request X-Request-ID header or generated by the Node Agent.
      required: true
      schema:
        type: string
        minLength: 1
