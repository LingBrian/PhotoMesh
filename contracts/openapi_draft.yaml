  /v1/pairing/peers/{peerId}/libraries/{libraryId}/tag-write:
    parameters:
      - in: path
        name: peerId
        required: true
        schema: {type: string}
      - in: path
        name: libraryId
        required: true
        schema: {type: string}
    put:
      summary: 显式授予可信作者在此图库写入标签事件的权限
      responses:
        '204': {description: Tag-write grant recorded, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Peer is untrusted or the 64-author library limit is reached; revoked author slots are retained, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected HTTP error using the common error envelope, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    delete:
      summary: 撤销此可信作者的后续标签写入权限，不复用作者槽位
      responses:
        '200':
          description: Tag-write grant revoked; operations already replicated to trusted peers cannot be retracted.
          headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [status, replicatedEventsRemain]
                properties:
                  status: {type: string, const: revoked}
                  replicatedEventsRemain: {type: boolean, const: true}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected HTTP error using the common error envelope, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
