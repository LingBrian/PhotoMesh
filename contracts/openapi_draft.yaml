openapi: 3.1.0
info:
  title: PhotoMesh Node HTTP API
  version: 0.1.0
  description: |-
    Contract for HTTP operations currently implemented by the Node Agent. The listener is plain HTTP; this document advertises only its default loopback URL. A private-LAN bind is not TLS: do not expose it off-host or send credentials over direct HTTP; use a separately configured trusted HTTPS-terminating proxy. P2P protocol messages are not HTTP routes. Generic CORS OPTIONS preflight returns 204 and is transport behavior, not a business operation. Every HTTP response includes X-Request-ID; JSON errors also echo it as requestId.
servers:
  - url: http://127.0.0.1:8443
    description: Default loopback HTTP listener; do not use direct HTTP for off-host access.
security:
  - nodeAdminBearer: []
paths:
  /v1/health:
    get:
      summary: 核心服务健康检查（不返回敏感元数据）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, protocolMin, protocolMax]
                properties:
                  status: {type: string, enum: [ok, degraded]}
                  protocolMin: {type: integer}
                  protocolMax: {type: integer}
                  capabilities:
                    type: array
                    items: {type: string}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/diagnostics:
    get:
      summary: 管理员查看节点组件健康状态与能力
      description: Requires the node administrator bearer token; returns enumerated statuses and capabilities only, never paths or user data.
      security:
        - nodeAdminBearer: []
      responses:
        '200':
          description: Component diagnostics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeDiagnostics'}
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          description: Forbidden
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries:
    get:
      summary: 当前主体有权查看的照片库
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Forbidden, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/assets:
    get:
      summary: 授权范围内的游标分页时间线
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string}
        - in: query
          name: cursor
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: q
          schema: {type: string, maxLength: 256}
      responses:
        '200':
          description: Assets page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetPage'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Library access denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '400': {description: Invalid cursor or query, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/assets/{assetId}/tags/{tag}:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: assetId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: tag
        required: true
        description: URL-encoded UTF-8 tag text; leading/trailing whitespace is trimmed; case is preserved; server limit is 128 UTF-8 bytes.
        schema: {type: string, minLength: 1, maxLength: 128}
    put:
      summary: Idempotently add a tag to an authorized asset
      responses:
        '204':
          description: Tag is present after the operation; repeating the request has no additional effect.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Empty/oversized tag or 64 active tags for this author and asset reached, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Node administrator or library authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: 'Asset is absent, tombstoned, or not visible in this library', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag persistence capability is unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      summary: Idempotently remove a tag from an authorized asset
      responses:
        '204':
          description: Tag is absent after the operation; repeating the request has no additional effect.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Empty/oversized tag, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Node administrator or library authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: 'Asset is absent, tombstoned, or not visible in this library', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag persistence capability is unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/assets/{assetId}/original:
    get:
      summary: 在每次请求校验图库 ACL 后流式读取不可变原图
      parameters:
        - in: path
          name: assetId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Original bytes; source is never modified
          headers:
            ETag: {schema: {type: string}}
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {description: Asset is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Source location is offline, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Original stream failed before response headers were sent, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/assets/{assetId}/thumbnail:
    get:
      summary: 每次请求校验图库 ACL 后读取固定尺寸的 WebP 缩略图
      description: Cache hits are also ACL-protected. Never falls back to returning original bytes.
      parameters:
        - in: path
          name: libraryId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: path
          name: assetId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: query
          name: profile
          required: false
          schema: {type: string, enum: [timeline-192], default: timeline-192}
      responses:
        '200':
          description: Bounded derived WebP thumbnail; no EXIF/GPS metadata
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Content-Disposition: {schema: {type: string, const: inline}}
            Vary: {schema: {type: string, const: Authorization}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            image/webp:
              schema: {type: string, format: binary}
        '400': {description: Invalid path or profile, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Asset is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Source changed or offline and no matching derived cache exists, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Source or generated thumbnail exceeds configured byte limit, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '415': {description: Unsupported or multi-page source image, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Thumbnail processing failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '429':
          description: Bounded thumbnail queue is full
          headers:
            Retry-After: {schema: {type: string, const: '1'}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503': {description: Thumbnail processing capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/assets/{assetId}/versions:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: assetId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      summary: 列出管理员当前 Node 上此资产的不可变版本
      responses:
        '200':
          description: Original source metadata and immutable derived-version items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaVersionPage'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid path parameters, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Admin authorization required, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Asset is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Media-version capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    post:
      summary: 排队创建裁剪/旋转派生版本，不修改原件
      description: Requires the mediaVersions capability and a currently online, hash-matching source.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MediaVersionCreate'}
      responses:
        '202':
          description: Operation accepted; poll the version resource until ready or failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaVersionOperation'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid transform or request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Admin authorization required, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Asset is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: 'Source changed or idempotency key conflict', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: 'Input-size or pixel limit exceeded before the asynchronous operation is accepted', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '415': {description: Unsupported media format, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Media transform processing failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: 'Source or storage unavailable, or temporary media-version capacity limit reached; retry later', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/assets/{assetId}/versions/{versionId}:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: assetId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: versionId
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Read authorized operation/version metadata and state
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MediaVersion'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid path parameters, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Admin authorization required, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Version is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Media-version capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/assets/{assetId}/versions/{versionId}/content:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: assetId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: versionId
        required: true
        schema: {type: string, format: uuid}
    get:
      summary: Stream exact bytes of a ready derived version after reauthorization
      responses:
        '200':
          description: Derived bytes; never falls back to the original
          headers:
            ETag: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
            Content-Disposition: {schema: {type: string, const: inline}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
        '400': {description: Invalid path parameters, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Admin authorization required, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Version is absent or not authorized, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Version is not ready or failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: 'Media-version capability unavailable, storage unavailable, or integrity verification failed', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/recycle-bin:
    get:
      summary: Read visible deletion tombstones without deleting source originals
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Active tombstones for the authorized library
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Tombstone'}}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Library access denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/recycle-bin/restore:
    post:
      summary: Restore an active tombstone by appending a signed asset.restored event
      description: Requires current Node administrator credentials and read authorization for the specified library. Repeating a request after commit reuses the recorded restore event ID without appending another event. Never deletes or rewrites source originals.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [libraryId, eventId]
              properties:
                libraryId: {type: string, minLength: 1, maxLength: 128}
                eventId: {type: string, format: uuid}
      responses:
        '200':
          description: Restore completed or already recorded; retries reuse the persisted restore event ID without appending another event
          content:
            application/json:
              schema:
                type: object
                required: [status, tombstoneEventId, restoreEventId]
                properties:
                  status: {type: string, const: restored}
                  tombstoneEventId: {type: string, format: uuid, description: Tombstone event ID targeted by this request}
                  restoreEventId: {type: string, format: uuid, description: Newly signed or previously recorded asset.restored event ID}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Admin authorization or library read authorization denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Tombstone not found in the specified library, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: "Tombstone is inactive without a recorded restore event, or causal frontier cannot be represented", headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Sync capability unavailable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/invitations:
    post:
      summary: 创建短期一次性 LAN 配对邀请（返回供客户端编码为二维码的载荷）
      responses:
        '201':
          description: 2 分钟有效、一次性使用的邀请
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairingInvite'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/join:
    post:
      summary: 扫描邀请二维码后，以本地节点身份通过 Noise 通道加入对端
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingJoin'}
      responses:
        '200':
          description: Remote Peer ID verified and trusted locally
          content:
            application/json:
              schema:
                type: object
                required: [hostPeerId]
                properties:
                  hostPeerId: {type: string}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: 'Administrator authorization denied, or invite expired, replayed, declined, or identity mismatch', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/peers:
    get:
      summary: 列出可信、已撤销节点和待审批设备
      responses:
        '200':
          description: Trust and approval state
          content:
            application/json:
              schema:
                type: object
                required: [peers, pending]
                properties:
                  peers: {type: array, items: {$ref: '#/components/schemas/TrustedPeer'}}
                  pending: {type: array, items: {$ref: '#/components/schemas/PendingPeerApproval'}}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/peers/{peerId}/approval:
    post:
      summary: 本地用户确认或拒绝经过 Noise 身份验证的配对请求
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairingApproval'}
      responses:
        '200': {description: Approval recorded, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '400': {description: Invalid approval request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Pending request not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/peers/{peerId}:
    delete:
      summary: 撤销节点并关闭现存 P2P 连接
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Peer revoked, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Peer not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/peers/{peerId}/libraries/{libraryId}:
    put:
      summary: 明确授予可信节点对单个图库的只读权限
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
        - in: path
          name: libraryId
          required: true
          schema: {type: string}
      responses:
        '204': {description: Read grant recorded, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Peer is not trusted, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/peers/{peerId}/libraries/{libraryId}/tag-write:
    parameters:
      - in: path
        name: peerId
        required: true
        schema: {type: string}
      - in: path
        name: libraryId
        required: true
        schema: {type: string}
    put:
      summary: 显式授予可信作者在此图库写入标签事件的权限
      responses:
        '204': {description: Tag-write grant recorded, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Peer is untrusted or the 64-author library limit is reached; revoked author slots are retained, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected HTTP error using the common error envelope, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    delete:
      summary: 撤销此可信作者的后续标签写入权限，不复用作者槽位
      responses:
        '200':
          description: Tag-write grant revoked; operations already replicated to trusted peers cannot be retracted.
          headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
          content:
            application/json:
              schema:
                type: object
                required: [status, replicatedEventsRemain]
                properties:
                  status: {type: string, const: revoked}
                  replicatedEventsRemain: {type: boolean, const: true}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected HTTP error using the common error envelope, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/libraries/{libraryId}/tag-writers:
    get:
      summary: 列出此图库当前有标签写入权限的可信节点
      parameters:
        - in: path
          name: libraryId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Active tag writers
          content:
            application/json:
              schema:
                type: object
                required: [writers]
                properties:
                  writers: {type: array, maxItems: 64, items: {type: string}}
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/peers/{peerId}/tag-sync-status:
    get:
      summary: 获取节点的标签待同步数量和最后错误码
      parameters:
        - in: path
          name: peerId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Per-peer tag sync status
          content:
            application/json:
              schema:
                type: object
                required: [pending, lastError]
                properties:
                  pending: {type: integer, minimum: 0}
                  lastError: {type: [string, 'null']}
          headers:
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Tag sync capability is unavailable on this node, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/pairing/discovered:
    get:
      summary: 获取 mDNS 发现的未信任节点地址（发现不代表信任）
      responses:
        '200':
          description: Discovered peer hints
          content:
            application/json:
              schema:
                type: object
                required: [peers]
                properties:
                  peers:
                    type: array
                    items:
                      type: object
                      required: [peerId, addresses]
                      properties:
                        peerId: {type: string}
                        addresses: {type: array, items: {type: string}}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/pairing/manual-discovery:
    post:
      summary: 通过明确私有 LAN IP 建立 Noise 身份验证连接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, peerId]
              properties:
                host: {type: string}
                port: {type: integer, minimum: 1, maximum: 65535}
                peerId: {type: string}
      responses:
        '200': {description: Authenticated peer address, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}}
        '400': {description: Invalid address, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Pairing administration denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '502': {description: Peer could not be reached, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads:
    post:
      summary: 创建有期限的分块上传会话
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadCreate'}
      responses:
        '201':
          description: Upload session created or replayed idempotently
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '400': {description: Invalid request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Idempotency key reused for a different request, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Upload exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload session creation failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}:
    get:
      summary: 查询允许续传的偏移位置
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload session lookup failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}/chunks/{chunkIndex}:
    put:
      summary: Write one immutable, resumable upload chunk
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
        - in: path
          name: chunkIndex
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Offset
          required: true
          schema: {type: integer, minimum: 0}
        - in: header
          name: Upload-Chunk-SHA256
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Chunk accepted and offset durably advanced
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadSession'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '400': {description: Invalid offset or request body, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Upload session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Upload session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Offset or chunk idempotency conflict, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Chunk exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '422': {description: Chunk checksum mismatch, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Chunk write failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '507': {description: Managed storage has insufficient capacity, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/uploads/{sessionId}/complete:
    post:
      summary: Verify complete SHA-256 and atomically commit immutable original
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Original published and metadata committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadComplete'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Upload session not found, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Upload incomplete or session not writable, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: Session expired, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Upload exceeds configured limits, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '422': {description: Complete file checksum mismatch, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '500': {description: Upload completion failed, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '507': {description: Managed storage has insufficient capacity, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    nodeAdminBearer:
      type: http
      scheme: bearer
      bearerFormat: node-admin-token
  schemas:
    NodeDiagnostics:
      type: object
      additionalProperties: false
      required: [status, readiness, components]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        readiness: {type: string, enum: [ready, not_ready]}
        components:
          type: object
          additionalProperties: false
          required: [api, database, storage, identity]
          properties:
            api: {$ref: '#/components/schemas/DiagnosticComponent'}
            database: {$ref: '#/components/schemas/DiagnosticComponent'}
            storage: {$ref: '#/components/schemas/DiagnosticComponent'}
            identity: {$ref: '#/components/schemas/DiagnosticComponent'}
    DiagnosticComponent:
      type: object
      additionalProperties: false
      required: [status, capabilities]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        capabilities:
          type: array
          uniqueItems: true
          maxItems: 8
          items:
            type: string
            enum: [rest, mediaVersions, thumbnails, assetTags, tagSync, sqlite, managedFiles, nodeIdentity, eventSigning, lanPairing]
    PairingInvite:
      type: object
      required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt, qrDataUrl]
      properties:
        protocol: {type: string, const: photomesh-pairing}
        version: {type: integer, const: 1}
        hostPeerId: {type: string}
        addresses: {type: array, items: {type: string}}
        inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
        secret: {type: string, minLength: 43, maxLength: 43}
        expiresAt: {type: string, format: date-time}
        qrDataUrl: {type: string, pattern: '^data:image/png;base64,'}
    PairingJoin:
      type: object
      required: [invite, label]
      properties:
        invite:
          type: object
          required: [protocol, version, hostPeerId, addresses, inviteId, secret, expiresAt]
          properties:
            protocol: {type: string, const: photomesh-pairing}
            version: {type: integer, const: 1}
            hostPeerId: {type: string}
            addresses: {type: array, maxItems: 32, items: {type: string, maxLength: 512}}
            inviteId: {type: string, pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'}
            secret: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
            expiresAt: {type: string, format: date-time}
        label: {type: string, maxLength: 80}
        manualIp:
          type: object
          required: [host, port]
          properties:
            host: {type: string}
            port: {type: integer, minimum: 1, maximum: 65535}
    TrustedPeer:
      type: object
      required: [peerId, publicKey, label, trustState, createdAt, revokedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        label: {type: string}
        trustState: {type: string, enum: [trusted, revoked]}
        createdAt: {type: string, format: date-time}
        revokedAt: {type: [string, 'null'], format: date-time}
    PendingPeerApproval:
      type: object
      required: [peerId, publicKey, proposedLabel, requestedAt]
      properties:
        peerId: {type: string}
        publicKey: {type: string}
        proposedLabel: {type: string}
        requestedAt: {type: string, format: date-time}
    PairingApproval:
      type: object
      required: [approved]
      properties:
        approved: {type: boolean}
        label: {type: string, maxLength: 80}
        libraryIds: {type: array, uniqueItems: true, items: {type: string, maxLength: 128}}
    Library:
      type: object
      required: [libraryId, title]
      properties:
        libraryId: {type: string}
        title: {type: string}
        encryptionPolicy: {type: string, enum: [none, optional_e2ee, required_e2ee]}
    LibraryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Library'}}
    Asset:
      type: object
      required: [assetId, libraryId, originNodeId, kind, sha256, availability, filename, capturedAt, sourcePath, sourceKind, byteSize, version, tags]
      properties:
        assetId: {type: string}
        libraryId: {type: string}
        originNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo]}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        capturedAt: {type: [string, 'null'], format: date-time}
        availability: {type: string, enum: [online, cached, offline, missing]}
        filename: {type: string}
        sourcePath: {type: [string, 'null']}
        sourceKind: {type: string, enum: [upload, import]}
        byteSize: {type: integer, minimum: 0}
        version: {type: string}
        tags:
          type: array
          maxItems: 4096
          description: Current merged signed OR-set membership on this Node; sorted and synchronized independently of metadata events. A writer may contribute at most 64 active tags per asset; the merged view is capped at 4096.
          items:
            type: string
            minLength: 1
            maxLength: 128
            description: Trimmed, case-sensitive tag text with a maximum of 128 UTF-8 bytes.
    AssetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Asset'}
        nextCursor: {type: [string, 'null']}
    MediaCrop:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      properties:
        x: {type: integer, minimum: 0, maximum: 1000000}
        y: {type: integer, minimum: 0, maximum: 1000000}
        width: {type: integer, minimum: 1, maximum: 1000000}
        height: {type: integer, minimum: 1, maximum: 1000000}
    MediaTransform:
      type: object
      additionalProperties: false
      required: [crop, rotation]
      properties:
        crop: {$ref: '#/components/schemas/MediaCrop'}
        rotation: {type: integer, enum: [0, 90, 180, 270]}
    MediaVersionCreate:
      type: object
      additionalProperties: false
      required: [sourceVersionId, sourceSha256, transform, idempotencyKey]
      properties:
        sourceVersionId: {type: [string, 'null'], minLength: 1, maxLength: 128}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        transform: {$ref: '#/components/schemas/MediaTransform'}
        idempotencyKey: {type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$'}
    MediaVersionStatus:
      type: string
      enum: [staging, ready, failed]
    MediaVersionOperation:
      type: object
      additionalProperties: false
      required: [operationId, versionId, status]
      properties:
        operationId: {type: string, format: uuid}
        versionId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MediaVersionStatus'}
    MediaVersion:
      type: object
      additionalProperties: false
      required: [versionId, assetId, sourceVersionId, sourceSha256, outputSha256, mimeType, byteSize, width, height, transform, status, createdAt, errorCode]
      properties:
        versionId: {type: string, format: uuid}
        assetId: {type: string}
        sourceVersionId: {type: [string, 'null']}
        sourceSha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        outputSha256: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$'}
        mimeType: {type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, null]}
        byteSize: {type: [integer, 'null'], minimum: 0}
        width: {type: [integer, 'null'], minimum: 1}
        height: {type: [integer, 'null'], minimum: 1}
        transform: {$ref: '#/components/schemas/MediaTransform'}
        status: {$ref: '#/components/schemas/MediaVersionStatus'}
        createdAt: {type: string, format: date-time}
        errorCode: {type: [string, 'null']}
    MediaVersionSource:
      type: object
      additionalProperties: false
      required: [sourceVersionId, sha256, mimeType, byteSize, filename, availability]
      properties:
        sourceVersionId: {type: 'null'}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        mimeType: {type: [string, 'null'], enum: [image/jpeg, image/png, image/webp, null]}
        byteSize: {type: integer, minimum: 0}
        filename: {type: string}
        availability: {type: string, enum: [online, cached, offline, missing]}
    MediaVersionPage:
      type: object
      additionalProperties: false
      required: [original, items]
      properties:
        original: {$ref: '#/components/schemas/MediaVersionSource'}
        items: {type: array, items: {$ref: '#/components/schemas/MediaVersion'}}
    Tombstone:
      type: object
      required: [assetId, libraryId, eventId]
      properties:
        assetId: {type: string}
        libraryId: {type: string}
        eventId: {type: string}
    UploadCreate:
      type: object
      required: [libraryId, filename, sourceKind, totalBytes, sha256]
      properties:
        libraryId: {type: string}
        filename: {type: string, minLength: 1}
        originalPath: {type: string, description: Exact source path metadata; never used as a write destination}
        sourceKind: {type: string, enum: [upload, import]}
        sourceNodeId: {type: string}
        kind: {type: string, enum: [photo, video, live_photo], default: photo}
        totalBytes: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    UploadSession:
      type: object
      required: [sessionId, offset, expiresAt, state]
      properties:
        sessionId: {type: string}
        offset: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        state: {type: string, enum: [created, uploading, verifying, completed, failed]}
    UploadComplete:
      type: object
      required: [sessionId, assetId, fileId, sha256, byteLength, storageRef]
      properties:
        sessionId: {type: string}
        assetId: {type: string}
        fileId: {type: string}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        byteLength: {type: integer, minimum: 0}
        storageRef: {type: string}
    ApiError:
      type: object
      description: Open error envelope. Clients must tolerate unknown error codes and additional fields.
      required:
        - error
        - requestId
      properties:
        error:
          type: string
          minLength: 1
          description: Stable machine-readable error code; unknown values are possible. This example list is not closed.
          examples: [invalid_request, forbidden, not_found, capability_unavailable, thumbnail_invalid, source_offline, media_read_failed, unsupported_media_type, version_failed, version_not_ready, tombstone_not_active, causal_context_conflict, pairing_rejected, peer_unreachable, pending_request_not_found, peer_not_trusted, peer_not_found, idempotency_conflict, offset_conflict, chunk_conflict, session_failed, incomplete_upload, session_expired, too_large, checksum_mismatch, capacity_exhausted, storage_io, source_changed, unsupported_media, processing_failed, queue_full, storage_failed, version_unavailable]
        requestId:
          type: string
          minLength: 1
          description: Matches the X-Request-ID response header.
  headers:
    XRequestId:
      description: Correlation ID echoed from the request X-Request-ID header or generated by the Node Agent.
      required: true
      schema:
        type: string
        minLength: 1
