        '403': {description: 'Administrator authorization denied, or invite expired, replayed, declined, or identity mismatch', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
