openapi: 3.1.0
info:
  title: PhotoMesh Node HTTP API
  version: 0.1.0
  description: |-
    Contract for HTTP operations currently implemented by the Node Agent. The listener is plain HTTP; this document advertises only its default loopback URL. A private-LAN bind is not TLS: do not expose it off-host or send credentials over direct HTTP; use a separately configured trusted HTTPS-terminating proxy. P2P protocol messages are not HTTP routes. Generic CORS OPTIONS preflight returns 204 and is transport behavior, not a business operation. Every HTTP response includes X-Request-ID; JSON errors also echo it as requestId.
servers:
  - url: http://127.0.0.1:8443
    description: Default loopback HTTP listener; do not use direct HTTP for off-host access.
security:
  - nodeAdminBearer: []
paths:
  /v1/health:
    get:
      summary: 核心服务健康检查（不返回敏感元数据）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, protocolMin, protocolMax]
                properties:
                  status: {type: string, enum: [ok, degraded]}
                  protocolMin: {type: integer}
                  protocolMax: {type: integer}
                  capabilities:
                    type: array
                    items: {type: string}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/diagnostics:
    get:
      summary: 管理员查看节点组件健康状态与能力
      description: Requires the node administrator bearer token; returns enumerated statuses and capabilities only, never paths or user data.
      security:
        - nodeAdminBearer: []
      responses:
        '200':
          description: Component diagnostics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeDiagnostics'}
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403':
          description: Forbidden
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries:
    get:
      summary: 当前主体有权查看的照片库
      responses:
        '200':
          description: Library list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
        '403': {description: Forbidden, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/libraries/{libraryId}/external-scan-review:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      summary: 读取外部目录扫描人工核对报告
      description: 只读报告；不触发扫描、不删除文件、不写入墓碑。仅返回当前主体有权查看的图库。
      responses:
        '200':
          description: External scan review
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
          content: {application/json: {schema: {$ref: '#/components/schemas/ExternalScanReviewPage'}}}
        '400': {description: Invalid path or query, headers: {Cache-Control: {schema: {type: string, const: no-store}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Unknown or unauthorized library, headers: {Cache-Control: {schema: {type: string, const: no-store}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: External scan capability unavailable, headers: {Cache-Control: {schema: {type: string, const: no-store}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: no-store}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      summary: 管理员分页读取图库中的手动虚拟相册
      description: 当前 Node HTTP API 仅开放给本机管理员。列表不包含删除状态；按 albumId 二进制顺序 keyset 分页，cursor 不代表 MVCC 快照。
      parameters:
        - in: query
          name: cursor
          schema: {type: string, maxLength: 2048}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Album page
          content: {application/json: {schema: {$ref: '#/components/schemas/AlbumPage'}}}
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '400': {description: Invalid/repeated/unknown query parameter or cursor, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Invalid or missing node-admin bearer token, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Unknown/unauthorized library, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    post:
      summary: 创建手动虚拟相册
      parameters:
        - $ref: '#/components/parameters/AlbumIdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAlbumRequest'}}}
      responses:
        '201':
          description: Album created; same idempotency key and canonical request replays this original resource.
          content: {application/json: {schema: {$ref: '#/components/schemas/Album'}}}
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '400': {description: Invalid body/title/idempotency key, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Body exceeds the album request limit, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Invalid or missing node-admin bearer token, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Unknown/unauthorized library, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Global idempotency key conflict or 64-author limit reached, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums/{albumId}/deletion:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: albumId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    post:
      summary: Locally-administered reversible soft deletion of a virtual album
      description: Requires the local node administrator. local creates a node-local tombstone; global creates a replicated deletion event subject to album-delete grants. Both are reversible; this API never physically purges an album or source asset.
      parameters:
        - $ref: '#/components/parameters/AlbumIdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AlbumDeletionRequest'}}}
      responses:
        '204':
          description: Deletion recorded or idempotent no-op replay; no body
          headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
        '400': {description: 'Invalid scope, request, or idempotency key', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Local node-admin authorization denied, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Album absent or not authorized; no cross-library disclosure, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Idempotency conflict or required global album-delete grant absent, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album sync capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error using the common error envelope, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums/deleted:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      summary: Page reversible soft-deleted albums visible at this node
      description: Local-admin only. Keyset cursor is not an MVCC snapshot; scope selects all, local-only, or globally replicated tombstones. No physical purge is performed.
      parameters:
        - in: query
          name: scope
          required: true
          schema: {type: string, enum: [all, local, global]}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 2048}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Deleted album page without total count
          content: {application/json: {schema: {$ref: '#/components/schemas/DeletedAlbumPage'}}}
          headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
        '400': {description: Invalid or repeated query parameter or cursor, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Local node-admin authorization denied, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Unknown or unauthorized library, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album sync capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error using the common error envelope, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums/{albumId}/restore:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: albumId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    post:
      summary: Restore a soft-deleted album locally or globally
      description: Requires the local node administrator. Restores only the selected tombstone scope; the operation is reversible and never purges data.
      parameters:
        - $ref: '#/components/parameters/AlbumIdempotencyKey'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AlbumRestoreRequest'}}}
      responses:
        '204':
          description: Album restored or scope was already active; no body
          headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}
        '400': {description: Invalid scope or request, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Local node-admin authorization denied, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: Deleted album absent or not authorized, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Global restore grant missing or tombstone state conflicts, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album sync capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error using the common error envelope, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums/{albumId}/members:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: albumId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    get:
      summary: 分页读取相册中可见资产 ID
      description: 仅返回 {assetId} allowlist；过滤 tombstone 后分页。Keyset cursor 非快照，改动后客户端可从第一页刷新。
      parameters:
        - in: query
          name: cursor
          schema: {type: string, maxLength: 2048}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: Member page with no total count
          content: {application/json: {schema: {$ref: '#/components/schemas/AlbumMemberPage'}}}
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '400': {description: Invalid/repeated/unknown query parameter or cursor, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Invalid or missing node-admin bearer token, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: 'Unauthorized/unknown library, missing/cross-library album', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/libraries/{libraryId}/albums/{albumId}/members/{assetId}:
    parameters:
      - in: path
        name: libraryId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: albumId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      - in: path
        name: assetId
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    put:
      summary: 幂等添加虚拟相册成员
      description: Requires a globally unique Idempotency-Key UUID. Same-author active add is a no-op; a new author contributes an observed add token.
      parameters:
        - $ref: '#/components/parameters/AlbumIdempotencyKey'
      responses:
        '204':
          description: Member is present after the operation.
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '400': {description: 'Invalid/repeated idempotency key, body or query', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Body exceeds the album request limit, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Invalid or missing node-admin bearer token, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: 'Unauthorized/unknown library, missing/cross-library album or asset, or tombstone', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Idempotency conflict or author limit reached, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
    delete:
      summary: 幂等移除已观察的相册成员 add 操作
      description: Remove operation atomically records every currently observed add ID (maximum 64); an unseen concurrent add remains active.
      parameters:
        - $ref: '#/components/parameters/AlbumIdempotencyKey'
      responses:
        '204':
          description: Observed member adds have been removed; replays have no additional effect.
          headers:
            Cache-Control: {schema: {type: string, const: 'private, no-store'}}
            X-Request-ID: {$ref: '#/components/headers/XRequestId'}
        '400': {description: 'Invalid/repeated idempotency key, body or query', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '413': {description: Body exceeds the album request limit, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '403': {description: Invalid or missing node-admin bearer token, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '404': {description: 'Unauthorized/unknown library, missing/cross-library album or asset, or tombstone', headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '409': {description: Idempotency conflict or 64-author limit reached, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '503': {description: Album capability unavailable, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default: {description: Unexpected error, headers: {Cache-Control: {schema: {type: string, const: 'private, no-store'}}, X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
  /v1/assets:
    get:
      summary: 授权范围内的游标分页图库搜索
      parameters:
        - in: query
          name: libraryId
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
        - in: query
          name: cursor
          schema: {type: string, maxLength: 2048, pattern: '^[A-Za-z0-9_-]+$'}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - in: query
          name: q
          description: Literal substring; if non-empty, requires at least 3 Unicode code points and at most 256 UTF-16 code units. SQLite FTS5 trigram case-folding; no accent folding.
          schema: {type: string, maxLength: 256, x-maxUtf16CodeUnits: 256}
        - in: query
          name: dateFrom
          description: Inclusive UTC calendar-date boundary.
          schema: {type: string, format: date}
        - in: query
          name: dateTo
          description: Exclusive UTC calendar-date boundary.
          schema: {type: string, format: date}
        - in: query
          name: kind
          description: Exact asset kind filter; combine with all other filters using AND.
          schema: {type: string, enum: [photo, video, live_photo]}
        - in: query
          name: sourceKind
          description: Exact source kind filter; local and synchronized assets use their normalized Gallery value.
          schema: {type: string, enum: [upload, import]}
        - in: query
          name: availability
          description: Exact availability filter; synchronized assets without local location evidence are missing.
          schema: {type: string, enum: [online, cached, offline, missing]}
      responses:
        '200':
          description: Assets page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetPage'}
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema: {type: string, const: 'private, no-store'}
        '403': {description: Library access denied, headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '400': {description: 'Invalid, duplicate, or unknown query parameter; short q; invalid UTC date/enum; or cursor/filter mismatch.', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        '410': {description: 'Legacy null-date cursor is stale after floating-date timeline ordering; restart pagination from the first page.', headers: {X-Request-ID: {$ref: '#/components/headers/XRequestId'}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}}
        default:
          description: Unexpected HTTP error using the common error envelope.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
