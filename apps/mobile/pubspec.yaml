name: photomesh_mobile
description: PhotoMesh Android mobile client.
publish_to: none
version: 0.1.0-rc.9+9
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.5
  photo_manager: ^3.12.0
  shared_preferences: ^2.5.4
  sqflite_common: ^2.5.14
  sqflite: ^2.4.4+2
  workmanager: ^0.10.10
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        default: sqlite3
flutter:
  uses-material-design: true
