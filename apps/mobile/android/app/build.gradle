plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeystorePath = System.getenv("PHOTOMESH_ANDROID_KEYSTORE")

android {
    namespace "org.photomesh.mobile"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_17.toString() }

    defaultConfig {
        applicationId "org.photomesh.mobile"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    if (releaseKeystorePath) {
        signingConfigs {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("PHOTOMESH_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PHOTOMESH_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("PHOTOMESH_ANDROID_KEY_PASSWORD")
            }
        }
        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter { source "../.." }
