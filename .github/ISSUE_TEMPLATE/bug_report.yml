name: Bug report
description: Report a reproducible problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include private photos, access tokens, or security exploit details. Report security issues privately through SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PhotoMesh revision or version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: "1.\n2.\n3."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Node.js or Flutter version, and relevant logs with secrets removed.
    validations:
      required: true
