name: Feature request
description: Propose a product or engineering improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What user need or problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected user-visible behavior.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data and security impact
      description: Consider original files, authorization, synchronization, and recovery.
