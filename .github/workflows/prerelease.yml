name: Build and publish prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version without the v prefix, for example 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate prerelease request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - id: validate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^0\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Only 0.x prerelease versions ending in alpha.N, beta.N, or rc.N are allowed." >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  gate:
    name: Release acceptance gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run release gate
        env:
          PHOTOMESH_CANDIDATE_ID: ${{ needs.validate.outputs.version }}
        run: pnpm release:gate
      - name: Upload candidate report even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-review
          path: artifacts/release-candidates/${{ needs.validate.outputs.version }}
          if-no-files-found: warn
          retention-days: 30

  build-web-and-nas:
    name: Build Web and NAS image
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @photomesh/web build
      - name: Package Web static site and Node Agent image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf "release-assets/PhotoMesh-$VERSION-web.tar.gz" -C apps/web/dist .
          docker build -f deploy/docker/node-agent.Dockerfile -t "photomesh/node-agent:$VERSION" .
          docker save "photomesh/node-agent:$VERSION" -o "release-assets/PhotoMesh-$VERSION-node-agent-linux-amd64.docker.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-web-nas
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  build-node-agent:
    name: Build Node Agent (${{ matrix.platform }})
    needs: [validate, gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @photomesh/node-agent build
      - name: Package Windows x64 Node Agent
        if: matrix.platform == 'windows-x64'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'photomesh-node-agent'
          pnpm --filter @photomesh/node-agent deploy --prod --legacy $stage
          if ($LASTEXITCODE -ne 0) { throw 'pnpm deploy failed.' }
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'dist'), (Join-Path $stage 'runtime') | Out-Null
          Copy-Item -Path 'apps/node-agent/dist/*' -Destination (Join-Path $stage 'dist') -Recurse -Force
          Copy-Item -LiteralPath (Get-Command node).Source -Destination (Join-Path $stage 'runtime/node.exe')
          Copy-Item -LiteralPath 'scripts/node-agent/start.ps1' -Destination (Join-Path $stage 'start.ps1')
          Copy-Item -LiteralPath 'scripts/node-agent/start.bat' -Destination (Join-Path $stage 'start.bat')
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $out "PhotoMesh-$env:VERSION-node-agent-windows-x64.zip")
          $installer = (Get-Content -Raw 'install.ps1').Replace('__VERSION__', $env:VERSION)
          Set-Content -NoNewline -Encoding utf8 (Join-Path $out 'install.ps1') $installer
          $installerBat = (Get-Content -Raw 'install.bat').Replace('__VERSION__', $env:VERSION)
          Set-Content -NoNewline -Encoding utf8 (Join-Path $out 'install.bat') $installerBat
          if (Select-String -Path (Join-Path $out 'install.ps1'), (Join-Path $out 'install.bat') -Pattern 'api\.github\.com') { throw 'Windows installers must not call the rate-limited GitHub API.' }
          if ((Get-Content -Raw (Join-Path $out 'install.bat')) -match '__VERSION__') { throw 'Windows release bootstrap was not version-pinned.' }
      - name: Package Linux x64 Node Agent
        if: matrix.platform == 'linux-x64'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/photomesh-node-agent"
          pnpm --filter @photomesh/node-agent deploy --prod --legacy "$stage"
          mkdir -p "$stage/dist" "$stage/runtime" "$GITHUB_WORKSPACE/release-assets"
          cp -R apps/node-agent/dist/. "$stage/dist/"
          cp -L "$(command -v node)" "$stage/runtime/node"
          cp scripts/node-agent/start.sh "$stage/start.sh"
          chmod +x "$stage/start.sh"
          tar -C "$stage" -czf "$GITHUB_WORKSPACE/release-assets/PhotoMesh-$VERSION-node-agent-linux-x64.tar.gz" .
          sed "s/__VERSION__/$VERSION/g" install.sh > "$GITHUB_WORKSPACE/release-assets/install.sh"
          chmod +x "$GITHUB_WORKSPACE/release-assets/install.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-node-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build signed Android APK
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate one-time prerelease signing key
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/photomesh-android-rc.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$key" -storetype JKS \
            -storepass "$password" -keypass "$password" -alias photomesh-rc \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=PhotoMesh CI prerelease"
          {
            echo "PHOTOMESH_ANDROID_KEYSTORE=$key"
            echo "PHOTOMESH_ANDROID_KEYSTORE_PASSWORD=$password"
            echo "PHOTOMESH_ANDROID_KEY_ALIAS=photomesh-rc"
            echo "PHOTOMESH_ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build and verify Android APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          output="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$output"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "$output/PhotoMesh-$VERSION-android-arm64.apk"
          keytool -exportcert -rfc -keystore "$PHOTOMESH_ANDROID_KEYSTORE" \
            -storepass "$PHOTOMESH_ANDROID_KEYSTORE_PASSWORD" -alias "$PHOTOMESH_ANDROID_KEY_ALIAS" \
            -file "$output/PhotoMesh-$VERSION-android-signing-certificate.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows desktop installers
    needs: [validate, gate]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'Starting Tauri Windows NSIS build.'
          pnpm --filter @photomesh/desktop exec tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows build failed.' }
          $bundleRoot = 'apps/desktop/src-tauri/target/release/bundle'
          $installers = Get-ChildItem -LiteralPath $bundleRoot -File -Recurse | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $installers | ForEach-Object { Write-Output "Unsigned installer ready: $($_.FullName) ($($_.Length) bytes)." }
      - name: Package unsigned Windows installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'apps/desktop/src-tauri/target/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Filter '*.exe' -File -ErrorAction Stop)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)." }
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $destination = Join-Path $out "PhotoMesh-$env:VERSION-windows-x64-unsigned.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $destination
          $hash = Get-FileHash -LiteralPath $destination -Algorithm SHA256
          Write-Output "Unsigned Windows NSIS installer ready: $destination ($((Get-Item -LiteralPath $destination).Length) bytes)."
          Write-Output "SHA-256: $($hash.Hash)"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish prerelease
    needs: [validate, gate, build-web-and-nas, build-node-agent, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-review
          path: release-assets/review
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-web-nas
          path: release-assets/products/web-nas
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-android
          path: release-assets/products/android
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-windows
          path: release-assets/products/windows
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-node-linux-x64
          path: release-assets/products/node-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-node-windows-x64
          path: release-assets/products/node-windows-x64
      - name: Curate product assets and checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .verdict "release-assets/review/release-report.json")" = "ready-for-human-review"
          published="release-assets/published"
          mkdir -p "$published"
          files=(
            "release-assets/products/android/PhotoMesh-$VERSION-android-arm64.apk"
            "release-assets/products/web-nas/PhotoMesh-$VERSION-web.tar.gz"
            "release-assets/products/web-nas/PhotoMesh-$VERSION-node-agent-linux-amd64.docker.tar"
            "release-assets/products/windows/PhotoMesh-$VERSION-windows-x64-unsigned.exe"
            "release-assets/products/node-linux-x64/PhotoMesh-$VERSION-node-agent-linux-x64.tar.gz"
            "release-assets/products/node-windows-x64/PhotoMesh-$VERSION-node-agent-windows-x64.zip"
          )
          for file in "${files[@]}"; do
            test -s "$file"
            cp "$file" "$published/"
          done
          cp "release-assets/review/CHANGELOG.md" "$published/CHANGELOG.md"
          cp "release-assets/review/sbom.cyclonedx.json" "$published/sbom.cyclonedx.json"
          while IFS= read -r -d '' file; do
            hash="$(sha256sum "$file" | cut -d ' ' -f1)"
            printf '%s  %s\n' "$hash" "${file##*/}"
          done < <(find "$published" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z) > "$published/SHA256SUMS.txt"
          {
            cat "$published/CHANGELOG.md"
            echo
            echo "## Release notes"
            echo
            echo "Windows desktop installer is unsigned. Verify downloaded files against SHA256SUMS.txt."
            echo "Android preview signing identity changes for each candidate; uninstall the previous preview before upgrading."
          } > "release-assets/RELEASE_NOTES.md"
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/published/*
      - name: Create prerelease
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets/published -maxdepth 1 -type f -print0 | sort -z)
          gh release create "v$VERSION" "${assets[@]}" --target main --prerelease \
            --title "PhotoMesh $VERSION" --notes-file release-assets/RELEASE_NOTES.md
