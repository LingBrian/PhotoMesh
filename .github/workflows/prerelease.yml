name: Build and publish prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Prerelease version without the v prefix, for example 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate prerelease request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - id: validate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^0\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]; then
            echo "Only 0.x prerelease versions ending in alpha.N, beta.N, or rc.N are allowed." >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  gate:
    name: Release acceptance gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run release gate
        env:
          PHOTOMESH_CANDIDATE_ID: ${{ needs.validate.outputs.version }}
        run: pnpm release:gate
      - name: Upload candidate report even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-review
          path: artifacts/release-candidates/${{ needs.validate.outputs.version }}
          if-no-files-found: warn
          retention-days: 30

  build-web-and-nas:
    name: Build Web and NAS image
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @photomesh/web build
      - name: Package Web static site and Node Agent image
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf "release-assets/PhotoMesh-$VERSION-web.tar.gz" -C apps/web/dist .
          docker build -f deploy/docker/node-agent.Dockerfile -t "photomesh/node-agent:$VERSION" .
          docker save "photomesh/node-agent:$VERSION" -o "release-assets/PhotoMesh-$VERSION-node-agent-linux-amd64.docker.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-web-nas
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build signed Android APK
    needs: [validate, gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate one-time prerelease signing key
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/photomesh-android-rc.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$key" -storetype JKS \
            -storepass "$password" -keypass "$password" -alias photomesh-rc \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=PhotoMesh CI prerelease"
          {
            echo "PHOTOMESH_ANDROID_KEYSTORE=$key"
            echo "PHOTOMESH_ANDROID_KEYSTORE_PASSWORD=$password"
            echo "PHOTOMESH_ANDROID_KEY_ALIAS=photomesh-rc"
            echo "PHOTOMESH_ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Build and verify Android APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          output="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$output"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          cp "$apk" "$output/PhotoMesh-$VERSION-android-arm64.apk"
          keytool -exportcert -rfc -keystore "$PHOTOMESH_ANDROID_KEYSTORE" \
            -storepass "$PHOTOMESH_ANDROID_KEYSTORE_PASSWORD" -alias "$PHOTOMESH_ANDROID_KEY_ALIAS" \
            -file "$output/PhotoMesh-$VERSION-android-signing-certificate.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-android
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build signed Windows desktop installers
    needs: [validate, gate]
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'Starting Tauri Windows NSIS build.'
          pnpm --filter @photomesh/desktop exec tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows build failed.' }
          $bundleRoot = 'apps/desktop/src-tauri/target/release/bundle'
          $installers = Get-ChildItem -LiteralPath $bundleRoot -File -Recurse | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $installers) { throw 'No Windows installer was produced.' }
          $installers | ForEach-Object { Write-Output "Unsigned installer ready: $($_.FullName) ($($_.Length) bytes)." }
      - name: Sign and verify Windows installers
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'apps/desktop/src-tauri/target/release/bundle'
          $installers = Get-ChildItem -LiteralPath $bundleRoot -File -Recurse | Where-Object { $_.Extension -in @('.msi', '.exe') }
          if (-not $installers) { throw 'No Windows installer is available to sign.' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Write-Output 'Creating an ephemeral Windows signing certificate.'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PhotoMesh CI prerelease' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(10)
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'photomesh-windows-rc.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          $publicCert = Join-Path $out "PhotoMesh-$env:VERSION-windows-signing-certificate.cer"
          Export-Certificate -Cert $cert -FilePath $publicCert | Out-Null
          Import-Certificate -FilePath $publicCert -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          $kits = [Environment]::GetFolderPath('ProgramFilesX86')
          $sdkBinRoot = Join-Path $kits 'Windows Kits\10\bin'
          Write-Output "Looking for x64 signtool.exe in SDK version folders under $sdkBinRoot."
          $signtoolPath = Get-ChildItem -LiteralPath $sdkBinRoot -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          if (-not $signtoolPath) { throw 'Windows SDK x64 signtool.exe was not found in version folders.' }
          Write-Output "Using signtool.exe at $signtoolPath."
          foreach ($installer in $installers) {
            Write-Output "Signing $($installer.Name)."
            & $signtoolPath sign /fd SHA256 /f $pfx /p $password $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)." }
            Write-Output "Verifying signature for $($installer.Name)."
            & $signtoolPath verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.Name)." }
            Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $out "PhotoMesh-$env:VERSION-windows-x64$($installer.Extension)")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-windows
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish prerelease
    needs: [validate, gate, build-web-and-nas, build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-review
          path: release-assets/review
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-web-nas
          path: release-assets/products/web-nas
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-android
          path: release-assets/products/android
      - uses: actions/download-artifact@v4
        with:
          name: photomesh-${{ needs.validate.outputs.version }}-windows
          path: release-assets/products/windows
      - name: Verify gate verdict and create checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(jq -r .verdict "release-assets/review/release-report.json")" = "ready-for-human-review"
          {
            cat "release-assets/review/CHANGELOG.md"
            echo
            echo "## Preview signing"
            echo
            echo "Android and Windows installers use one-time CI signing identities. They are cryptographically signed but are not signed by a trusted commercial publisher. The Android signing identity changes per candidate; uninstall an earlier preview before installing a newer one."
            echo
            echo "Verify downloaded files against SHA256SUMS.txt and the GitHub build provenance attestation."
          } > release-assets/RELEASE_NOTES.md
          find release-assets -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/**/*
      - name: Create prerelease
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "v$VERSION" "${assets[@]}" --target main --prerelease \
            --title "PhotoMesh $VERSION" --notes-file release-assets/RELEASE_NOTES.md
