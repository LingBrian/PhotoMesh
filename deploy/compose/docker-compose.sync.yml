services:
  windows-sim:
    build:
      context: ../..
      dockerfile: deploy/docker/node-agent.Dockerfile
    environment:
      NODE_ENV: test
      PORT: "8443"
      PHOTOMESH_DATA_DIR: /data
      PHOTOMESH_FIXTURE_MODE: "true"
      PHOTOMESH_FIXTURE_SECRET_DIR: /data/secrets
      PHOTOMESH_API_BIND_ADDRESS: ${PHOTOMESH_WINDOWS_SIM_IP:-172.29.0.2}
      PHOTOMESH_LAN_BIND_ADDRESSES: ${PHOTOMESH_WINDOWS_SIM_IP:-172.29.0.2}
      PHOTOMESH_P2P_PORT: "4001"
      PHOTOMESH_ADMIN_TOKEN: photomesh-compose-fixture-token
    volumes:
      - windows-sim-data:/data
    ports:
      - "127.0.0.1:${PHOTOMESH_WINDOWS_SIM_PORT:-18443}:8443"
    networks:
      sync-lan:
        ipv4_address: ${PHOTOMESH_WINDOWS_SIM_IP:-172.29.0.2}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.PHOTOMESH_API_BIND_ADDRESS+':8443/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  nas-sim:
    build:
      context: ../..
      dockerfile: deploy/docker/node-agent.Dockerfile
    environment:
      NODE_ENV: test
      PORT: "8443"
      PHOTOMESH_DATA_DIR: /data
      PHOTOMESH_FIXTURE_MODE: "true"
      PHOTOMESH_FIXTURE_SECRET_DIR: /data/secrets
      PHOTOMESH_API_BIND_ADDRESS: ${PHOTOMESH_NAS_SIM_IP:-172.29.0.3}
      PHOTOMESH_LAN_BIND_ADDRESSES: ${PHOTOMESH_NAS_SIM_IP:-172.29.0.3}
      PHOTOMESH_P2P_PORT: "4001"
      PHOTOMESH_ADMIN_TOKEN: photomesh-compose-fixture-token
    volumes:
      - nas-sim-data:/data
    ports:
      - "127.0.0.1:${PHOTOMESH_NAS_SIM_PORT:-18444}:8443"
    networks:
      sync-lan:
        ipv4_address: ${PHOTOMESH_NAS_SIM_IP:-172.29.0.3}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://'+process.env.PHOTOMESH_API_BIND_ADDRESS+':8443/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  sync-lan:
    driver: bridge
    ipam:
      config:
        - subnet: ${PHOTOMESH_SYNC_SUBNET:-172.29.0.0/24}

volumes:
  windows-sim-data:
  nas-sim-data:
